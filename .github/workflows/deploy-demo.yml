# Builds the Utopia County demonstration and deploys it to Cloudflare
# (https://utopia.osgovt.com) after CI passes on main, or when started by hand
# from the Actions tab. Needs two repository secrets: CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID. See docs/admin/hosted-demo.md.
name: Deploy demo

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-demo
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    # Only the project's own repository deploys; forks skip this.
    if: >-
      github.repository_owner == 'OSGovt' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: deploy/cloudflare/package-lock.json

      - name: Install the deploy tool
        working-directory: deploy/cloudflare
        run: npm ci --no-audit --no-fund

      - name: Build and deploy
        working-directory: deploy/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets (docs/admin/hosted-demo.md)."
            exit 1
          fi
          npx wrangler deploy

      - name: Check the demo answers
        run: |
          url="$(grep -o '"SITE_URL": *"[^"]*"' deploy/cloudflare/wrangler.jsonc | sed 's/.*"\(https[^"]*\)"/\1/')"
          echo "Waiting for $url/healthz (a new version can take several minutes to roll out)"
          for _ in $(seq 1 60); do
            if curl -fsS --max-time 20 "$url/healthz" >/dev/null 2>&1; then
              echo "The demo is up: $url"
              exit 0
            fi
            sleep 10
          done
          echo "::error::$url didn't answer within 10 minutes. See Workers & Pages > utopia-county > Logs in the Cloudflare dashboard."
          exit 1
