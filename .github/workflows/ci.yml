name: CI

# Runs on every push except the two routine data commits (the nightly traffic
# row and the weekly reach measurements), which change nothing CI tests. A
# newer push to the same branch cancels a run still in progress, so a burst of
# commits is tested once, at its newest commit. Tag pushes always run.
on:
  push:
    paths-ignore:
      - docs/traffic/traffic.csv
      - reach/**
  pull_request:
    paths-ignore:
      - docs/traffic/traffic.csv
      - reach/**

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: portal_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PORTAL_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/portal_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client tesseract-ocr poppler-utils shellcheck
      - name: Install Python packages
        run: |
          pip install -r requirements.txt -r requirements-dev.txt -r conformance/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Install axe-core
        run: npm ci
        working-directory: conformance
      - name: Check shell scripts
        run: shellcheck -S warning deploy/install.sh deploy/countyctl deploy/local/start.sh deploy/cloudflare/entrypoint.sh
      - name: Validate state packs
        run: python -m portal.cli pack validate
        env:
          PORTAL_SECRET_KEY: ci
      - name: Tests, including the conformance suite
        run: python -m pytest -q

  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build the application image
        run: docker build -t county-portal:ci .
      - name: Start the full stack and check health
        run: |
          sudo mkdir -p /var/lib/county-portal/data /var/lib/county-portal/import
          sudo chown 1000:1000 /var/lib/county-portal/data
          printf 'PORTAL_HOST=localhost\nPORTAL_TLS_MODE=internal\nPORTAL_SECRET_KEY=ci\nPOSTGRES_PASSWORD=ci\nPORTAL_SITE_URL=https://localhost\nPORTAL_IMAGE_TAG=ci\n' > .env
          docker compose up -d
          for _ in $(seq 1 40); do
            docker compose exec -T app python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')" && break
            sleep 3
          done
          docker compose exec -T app python -m portal.cli setup --name "CI County" --type county --state tx
          docker compose exec -T app python -m portal.cli backup
          docker compose exec -T app python -m portal.cli check
          curl -fsSk https://localhost/healthz
