name: Newcomer rehearsal
# A small model (Haiku), told to follow only the documentation, tries to get
# the project running on a clean machine. Where it gets stuck, a county IT
# contractor would too. Its findings become issues; the journal becomes a
# field note. Billed to the Console API key in ANTHROPIC_API_KEY, not a plan.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Tag or branch to rehearse
        default: v1.0.0
      runs:
        description: How many independent testers (1-3)
        default: "1"
  schedule:
    - cron: "17 8 * * 1"   # Mondays 08:17 UTC, after the Monday install check
permissions:
  contents: read
  issues: write
  id-token: write
concurrency: { group: newcomer-rehearsal, cancel-in-progress: false }
jobs:
  rehearse:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        tester: [1, 2, 3]
    env:
      REHEARSAL_REF: ${{ inputs.ref || 'v1.0.0' }}
    steps:
      - name: Only run as many testers as asked
        id: gate
        env:
          WANT: ${{ inputs.runs || '1' }}
          ME: ${{ matrix.tester }}
        run: |
          want="${WANT:-1}"; me="${ME}"
          if [ "$me" -le "$want" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; else echo "go=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v5
        if: steps.gate.outputs.go == 'true'
        with:
          ref: ${{ env.REHEARSAL_REF }}
          fetch-depth: 1
      - name: Read the brief from the default branch, not the tag
        if: steps.gate.outputs.go == 'true'
        id: brief
        run: |
          curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/.github/rehearsal/newcomer-brief.md" -o /tmp/newcomer-brief.md
          { echo "text<<BRIEF_EOF"; cat /tmp/newcomer-brief.md; echo; echo "BRIEF_EOF"; } >> "$GITHUB_OUTPUT"
          mkdir -p rehearsal/shots
      - uses: actions/setup-python@v6
        if: steps.gate.outputs.go == 'true'
        with: { python-version: "3.12" }
      - name: Playwright for screenshots
        if: steps.gate.outputs.go == 'true'
        run: pip install -q playwright && python -m playwright install --with-deps chromium
      - name: The tester
        if: steps.gate.outputs.go == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: ${{ steps.brief.outputs.text }}
          claude_args: |
            --model claude-haiku-5-5
            --max-turns 60
            --allowedTools "Bash,Read,Write,Glob"
      - name: Stop anything left running
        if: always() && steps.gate.outputs.go == 'true'
        run: |
          docker compose -f deploy/local/docker-compose.yml down -v 2>/dev/null || true
          pkill -f uvicorn 2>/dev/null || true
      - uses: actions/upload-artifact@v6
        if: always() && steps.gate.outputs.go == 'true'
        with:
          name: rehearsal-tester-${{ matrix.tester }}
          path: rehearsal
          if-no-files-found: warn
      - name: Open one issue for the run, with a checklist of findings
        if: steps.gate.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TESTER: ${{ matrix.tester }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -f rehearsal/findings.json ] || { echo "::warning::tester $TESTER wrote no findings.json"; exit 0; }
          python3 - <<'PY'
          import json, os, subprocess, datetime
          repo = os.environ["GITHUB_REPOSITORY"]; run = os.environ["RUN_URL"]; tester = os.environ["TESTER"]
          ref = os.environ.get("REHEARSAL_REF", "")
          try:
              findings = json.load(open("rehearsal/findings.json"))
          except Exception as e:
              print(f"::warning::findings.json unreadable: {e}"); raise SystemExit
          if not findings:
              print("::notice::no findings; no issue opened"); raise SystemExit
          verdict = ""
          try:
              j = open("rehearsal/journal.md").read()
              i = j.lower().rfind("verdict")
              verdict = j[i:i+200].splitlines()[0] if i >= 0 else ""
          except Exception:
              pass
          order = {"blocker": 0, "confusing": 1, "cosmetic": 2}
          findings.sort(key=lambda f: order.get(f.get("severity", "confusing"), 1))
          blockers = sum(1 for f in findings if f.get("severity") == "blocker")
          today = datetime.date.today().isoformat()
          title = f"Newcomer rehearsal {today} ({ref}, tester {tester}): {len(findings)} findings, {blockers} blockers"
          lines = [f"Newcomer rehearsal (Haiku, tester {tester}) following only the documentation at `{ref}`. "
                   f"One checklist item per finding; the nightly repair run ticks items as it fixes or answers them, and closes this issue when all are done.",
                   "", f"**{verdict}**" if verdict else "", f"Journal and screenshots: {run}", ""]
          for f in findings[:25]:
              sev = f.get("severity", "confusing")
              lines.append(f"- [ ] **{sev}** — {f.get('file','')}: {f.get('what_happened','')} _Expected:_ {f.get('expected_fix','')}")
          body = "\n".join(lines)
          args = ["gh", "api", f"repos/{repo}/issues", "-f", f"title={title}", "-f", f"body={body}",
                  "-f", "labels[]=readme-rehearsal", "-f", "labels[]=docs"]
          if blockers: args += ["-f", "labels[]=blocker"]
          subprocess.run(args, check=False)
          PY
