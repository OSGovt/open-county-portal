# Open County Portal: three services.
#   db     PostgreSQL 16 database
#   app    the portal (website, staff console, open API)
#   web    Caddy: HTTPS certificates and the public front door
#
# Settings come from /opt/county-portal/.env, written by the installer.
# Data lives under /var/lib/county-portal on the server, outside the containers,
# so updates never touch it. Manage everything with the 'countyctl' command.
name: county-portal

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: portal
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run the installer first}
    volumes:
      - /var/lib/county-portal/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal -d portal"]
      interval: 10s
      timeout: 5s
      retries: 10
    shm_size: 256mb

  app:
    image: county-portal:${PORTAL_IMAGE_TAG:-current}
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      PORTAL_DATA_DIR: /data
      PORTAL_DATABASE_URL: postgresql+psycopg://portal:${POSTGRES_PASSWORD}@db:5432/portal
    volumes:
      - /var/lib/county-portal/data:/data
      - /var/lib/county-portal/import:/import:ro
    depends_on:
      db:
        condition: service_healthy

  web:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      PORTAL_HOST: ${PORTAL_HOST:?run the installer first}
      PORTAL_ADMIN_EMAIL: ${PORTAL_ADMIN_EMAIL:-}
    volumes:
      - ./deploy/Caddyfile.${PORTAL_TLS_MODE:-public}:/etc/caddy/Caddyfile:ro
      - /var/lib/county-portal/caddy:/data
    depends_on:
      - app
