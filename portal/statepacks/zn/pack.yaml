forms:
  vital-record:
    title: Order a birth or death certificate
    office: county-clerk
    fee_code: birth_cert
    intro: Staff check your ID before the certificate is printed. Uploaded IDs are deleted automatically after review.
    fields:
    - name: record_type
      label: Which certificate?
      type: radio
      required: true
      options:
      - Birth certificate
      - Death certificate
    - name: name_on_record
      label: Full name on the record
      type: text
      required: true
    - name: event_date
      label: Date of birth or death
      type: date
      required: true
    - name: event_place
      label: City or county of birth or death
      type: text
      required: true
    - name: relationship
      label: Your relationship to the person named
      type: select
      required: true
      options:
      - I am the person named
      - Parent
      - Child
      - Sibling
      - Grandparent
      - Spouse
      - Legal representative
    - name: requester_name
      label: Your full name
      type: text
      required: true
      autocomplete: name
    - name: email
      label: Email
      type: email
      required: true
      autocomplete: email
    - name: id_photo
      label: Photo of your government-issued ID
      type: file
      required: true
      accept: image/*,application/pdf
      capture: environment
      sensitive: true
      hint: On a phone
      this opens your camera.: null
    - name: delivery
      label: How should we get it to you?
      type: radio
      required: true
      options:
      - Mail it to me
      - I will pick it up
    - name: mailing_address
      label: Mailing address
      type: textarea
      required: false
      hint: Required if you chose mail.
  marriage-license:
    title: Marriage license pre-application
    office: county-clerk
    intro: Both applicants must still appear before the clerk to sign and take the oath. This saves time at the
      counter.
    fields:
    - name: applicant_1
      label: First applicant's full legal name
      type: text
      required: true
    - name: applicant_2
      label: Second applicant's full legal name
      type: text
      required: true
    - name: email
      label: Email
      type: email
      required: true
      autocomplete: email
    - name: phone
      label: Phone
      type: tel
      required: false
      autocomplete: tel
    - name: twogether
      label: Do you have a Twogether in Nirvana certificate?
      type: radio
      required: true
      options:
      - 'Yes'
      - 'No'
    - name: preferred_date
      label: Preferred day to visit the clerk
      type: date
      required: false
  jury-response:
    title: Respond to a jury summons
    office: district-clerk
    fields:
    - name: juror_number
      label: Juror number from your summons
      type: text
      required: true
    - name: full_name
      label: Full name
      type: text
      required: true
      autocomplete: name
    - name: email
      label: Email
      type: email
      required: true
      autocomplete: email
    - name: response
      label: Your response
      type: radio
      required: true
      options:
      - I will serve on the date shown
      - I need to postpone
      - I am claiming an exemption
      - I believe I am disqualified
    - name: details
      label: Details
      type: textarea
      required: false
      hint: For a postponement
      give dates you can serve. For an exemption: null
      give the reason.: null
  ossf-permit:
    title: Septic (on-site sewage facility) permit application
    office: environmental-health
    fee_code: ossf_permit
    fields:
    - name: applicant
      label: Applicant name
      type: text
      required: true
      autocomplete: name
    - name: email
      label: Email
      type: email
      required: true
      autocomplete: email
    - name: phone
      label: Phone
      type: tel
      required: true
      autocomplete: tel
    - name: site_address
      label: Property address
      type: textarea
      required: true
    - name: property_id
      label: Appraisal district property ID
      type: text
      required: false
    - name: work
      label: Type of work
      type: radio
      required: true
      options:
      - New system
      - Repair
      - Modification
    - name: plans
      label: Site plan and design (PDF)
      type: file
      required: false
      accept: application/pdf,image/*
