  title: Search property records
  summary: Deeds, liens, plats and releases, free to search and download.
  category: Records
  featured: true
  online_label: Search records
  online_target: /records
  keywords: deed lien plat release grantor grantee real property
- slug: certified-copy
  office: county-clerk
  title: Get a certified copy
  summary: Order a certified copy of a recorded document, on paper or as a certified PDF.
  category: Records
  featured: true
  who: Anyone.
  needs: The instrument number, or the names on the document so you can find it.
  online_label: Find the document
  online_target: /records
  keywords: certified copy deed document
- slug: recording
  office: county-clerk
  title: Record a document
  summary: Record deeds, liens and other real property documents.
  category: Records
  who: Anyone may record in person or by mail. Electronic recording (eRecording) is limited by law to attorneys,
    lenders, title companies, state agencies and municipal clerks.
  needs: The original signed and acknowledged document, with a return address and legible names under each signature.
  in_person: Bring the document and payment to the County Clerk's recording counter.
  keywords: record recording deed file erecording
- slug: pay-property-tax
  office: tax-office
  title: Pay property tax
  summary: Look up your bill and pay in full or in part.
  category: Pay
  featured: true
  online_label: Find my bill
  online_target: /pay/property_tax
  keywords: tax property pay bill
- slug: vehicle-registration
  office: tax-office
  title: Renew vehicle registration
  summary: Renew online with the state's Nirvana by Nirvana service, or in person at the tax office.
  category: Vehicles
  featured: true
  handoff: true
  online_label: Go to Nirvana by Nirvana
  online_target: https://example.com/
  needs: License plate number, the last 4 digits of the VIN, proof of liability insurance, a passing inspection
    if your county requires emissions testing, and the identification the state requires.
  in_person: Title transfers and registrations past the online window are handled at the Tax Assessor-Collector's
    office.
  keywords: car truck vehicle registration renew sticker title
- slug: vital-records
  office: county-clerk
  title: Birth and death certificates
  summary: Order a certified copy of a Nirvana birth certificate, or a death certificate.
  category: Apply or request
  featured: true
  who: The person named on the record or an immediate family member (parent, child, sibling, grandparent, spouse),
    or a legal representative with documentation.
  needs: A current government-issued photo ID, the name, date and place of the event, and proof of relationship
    if you are not the person named.
  online_label: Start an order
  online_target: /apply/vital-record
  keywords: birth death certificate vital record
- slug: marriage-license
  office: county-clerk
  title: Marriage license
  summary: Start your application online, then visit the clerk to finish.
  category: Apply or request
  who: Two adults applying together. Applicants under 18 need a court order removing the disabilities of minority.
  needs: Valid photo identification for each applicant. A Twogether in Nirvana certificate lowers the fee and waives
